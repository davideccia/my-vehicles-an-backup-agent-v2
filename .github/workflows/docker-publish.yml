name: Docker publish

# Publishes Dockerfile.prod to Docker Hub as :X.Y.Z and :latest for both
# linux/amd64 and linux/arm64 whenever a GitHub Release is published on a
# vX.Y.Z tag:
#   gh release create v1.2.3 --generate-notes
# The tag must match the VERSION file (bump it in a commit first).
# Pre-releases (e.g. v1.3.0-rc.1) get their version tag but not :latest.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ddavideccia/my-vehicles-an-backup-agent

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Go stage cross-compiles on $BUILDPLATFORM; QEMU is only needed
      # for the arm64 runtime stage's `RUN apk add`.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Fail if not on a semver tag
        if: steps.meta.outputs.version == '' || !startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "::error::Release tag must be vX.Y.Z; when run manually, pick a vX.Y.Z tag as ref (got ${GITHUB_REF})"
          exit 1

      # VERSION is the source of truth: the release tag must match it, so a
      # release can't be cut without the version bump commit.
      - name: Check VERSION matches release tag
        env:
          TAG_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error file=VERSION::VERSION is ${FILE_VERSION} but release tag is v${TAG_VERSION}"
            exit 1
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
